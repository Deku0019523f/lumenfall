<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0a14" />
  <title>Lumenfall</title>
  <!-- Permet de jouer directement depuis GitHub Pages (sans build) : "three" est chargé depuis un CDN -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
  <style>
    #menu { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; overflow-y: auto; padding: 12px 16px; box-sizing: border-box; }
    #menu.dim { background: radial-gradient(ellipse at center, rgba(15,12,40,.55), rgba(5,4,14,.92)); }
    #menu.pause { background: rgba(5,4,14,.86); }
    #menu .logo { font-size: 52px; font-weight: 800; letter-spacing: 8px; text-shadow: 0 0 22px #9b8cff, 0 0 4px #fff; }
    #menu .tag { opacity: .7; letter-spacing: 3px; margin-top: -8px; font-size: 14px; }
    #menu .head { font-size: 26px; letter-spacing: 5px; text-shadow: 0 0 14px #9b8cff; }
    #menu .gold, #shards { color: #ffe08a; }
    #menu .col { display: flex; flex-direction: column; gap: 10px; width: min(320px, 80vw); }
    #menu .row { display: flex; gap: 12px; justify-content: center; align-items: stretch; width: 100%; max-width: 900px; }
    #menu .row.wrap { flex-wrap: wrap; }
    #menu button { font: inherit; color: #e8e4ff; background: rgba(155,140,255,.14); border: 2px solid rgba(155,140,255,.5); border-radius: 14px; padding: 12px 18px; font-weight: 700; letter-spacing: 2px; font-size: 16px; }
    #menu button small { display: block; font-weight: 400; letter-spacing: 1px; opacity: .75; margin-top: 3px; font-size: 12px; }
    #menu button.primary { background: rgba(155,140,255,.4); border-color: #c9bfff; box-shadow: 0 0 16px rgba(155,140,255,.5); }
    #menu button.danger { border-color: rgba(255,85,119,.6); color: #ff9db1; }
    #menu button:disabled { opacity: .4; }
    #menu button:active:not(:disabled) { transform: scale(.97); }
    #menu .back { margin-top: 4px; padding: 8px 22px; font-size: 14px; }
    #menu .card { min-width: 200px; } #menu .card b { display: block; font-size: 12px; opacity: .7; letter-spacing: 3px; }
    #menu .help { max-width: 640px; text-align: left; font-size: 14px; line-height: 1.45; } #menu .help p { margin: 6px 0; } .dim2 { opacity: .6; }
    #menu .tree { align-items: flex-start; gap: 10px; }
    #menu .branch { flex: 1; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    #menu .bname { color: var(--c); font-weight: 800; letter-spacing: 4px; border-bottom: 2px solid var(--c); padding-bottom: 4px; }
    #menu .skill { text-align: left; padding: 8px 10px; border-color: var(--c); font-size: 13px; letter-spacing: 0; display: flex; flex-direction: column; gap: 2px; }
    #menu .skill span { font-weight: 400; font-size: 11px; opacity: .8; } #menu .skill em { font-style: normal; color: #ffe08a; font-size: 12px; }
    #menu .skill.owned { background: rgba(255,224,138,.16); } #menu .skill.owned em { color: #9be36a; }
    #menu .skill.ok { background: rgba(155,140,255,.35); box-shadow: 0 0 10px var(--c); } #menu .skill.poor em { color: #ff9db1; }
    #menu .qlist { width: min(640px, 92vw); text-align: left; } #menu .qch { margin: 10px 0 4px; letter-spacing: 3px; font-size: 12px; opacity: .7; }
    #menu .q { display: flex; justify-content: space-between; gap: 10px; padding: 7px 10px; background: rgba(155,140,255,.1); border-radius: 8px; margin-bottom: 4px; font-size: 14px; }
    #menu .q.done { opacity: .55; } #menu .q em { font-style: normal; color: #ffe08a; white-space: nowrap; }
    #shards { position: absolute; top: calc(54px + env(safe-area-inset-top)); left: 14px; font-size: 15px; font-weight: 700; text-shadow: 0 0 8px #b8860b; pointer-events: none; transition: transform .1s; transform-origin: left; }
    #shards.pulse { transform: scale(1.25); }
    #quest { position: absolute; top: calc(66px + env(safe-area-inset-top)); right: 14px; max-width: 34vw; text-align: right; font-size: 12px; opacity: .85; text-shadow: 0 0 6px #000; pointer-events: none; display: none; }
    #dialog { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom)); width: min(720px, 92vw); z-index: 40; background: rgba(10,8,28,.92); border: 2px solid #9b8cff; border-radius: 14px; padding: 12px 16px 14px; display: none; box-shadow: 0 0 22px rgba(155,140,255,.4); }
    #dialog .who { color: #ffe08a; font-weight: 800; letter-spacing: 2px; margin-bottom: 4px; font-size: 14px; }
    #dialog .txt { font-size: 16px; line-height: 1.4; min-height: 46px; }
    #dialog .nxt { text-align: right; opacity: .6; font-size: 12px; animation: blink 1s infinite; } @keyframes blink { 50% { opacity: .1; } }
    #rotate { position: fixed; inset: 0; z-index: 60; background: #0b0a14; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; font-size: 20px; padding: 24px; }
    #rotate .ico { font-size: 64px; animation: tilt 1.6s ease-in-out infinite; }
    @keyframes tilt { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-90deg); } }
    @media (orientation: portrait) { #rotate { display: flex; } }
    #err { position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 70; background: rgba(120,0,30,.9); color: #fff; font: 12px monospace; padding: 8px; border-radius: 6px; display: none; white-space: pre-wrap; }
    html, body { margin: 0; height: 100%; background: #0b0a14; overflow: hidden;
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      font-family: system-ui, sans-serif; color: #e8e4ff; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #hud { position: fixed; inset: 0; pointer-events: none; }
    #hud > * { pointer-events: auto; }
    .bar { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 14px; display: flex; gap: 6px; align-items: center; pointer-events: none; }
    .mask { width: 18px; height: 22px; border-radius: 50% 50% 45% 45%; background: #e8e4ff; box-shadow: 0 0 8px #9b8cff; }
    .mask.empty { background: transparent; border: 2px solid #5b5580; box-shadow: none; }
    #energy { position: absolute; top: calc(40px + env(safe-area-inset-top)); left: 14px; width: 120px; height: 8px; background: #1d1a33; border-radius: 4px; overflow: hidden; pointer-events: none; }
    #energyFill { height: 100%; width: 100%; background: linear-gradient(90deg, #6ee7ff, #9b8cff); transition: width .1s; }
    #menuBtn { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 14px; width: 44px; height: 44px; border-radius: 50%; border: 2px solid #5b5580; background: rgba(20,18,40,.6); color: #e8e4ff; font-size: 18px; }
    #stick { position: absolute; left: 24px; bottom: calc(24px + env(safe-area-inset-bottom)); width: 140px; height: 140px; border-radius: 50%; background: rgba(155,140,255,.12); border: 2px solid rgba(155,140,255,.35); }
    #knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(155,140,255,.55); }
    .btn { position: absolute; width: 68px; height: 68px; border-radius: 50%; border: 2px solid rgba(232,228,255,.5); background: rgba(20,18,40,.55); color: #e8e4ff; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .btn.on { background: rgba(155,140,255,.5); }
    #bAtk { right: 28px; bottom: calc(60px + env(safe-area-inset-bottom)); width: 84px; height: 84px; }
    #bJump { right: 124px; bottom: calc(36px + env(safe-area-inset-bottom)); }
    #bDash { right: 28px; bottom: calc(160px + env(safe-area-inset-bottom)); }
    #bSpec { right: 112px; bottom: calc(118px + env(safe-area-inset-bottom)); width: 60px; height: 60px; }
    #title { position: fixed; left: 0; right: 0; top: 32%; text-align: center; font-size: 38px; letter-spacing: 5px; text-shadow: 0 0 18px #9b8cff; pointer-events: none; opacity: 0; z-index: 20; }
    #title small { display: block; font-size: 15px; letter-spacing: 6px; opacity: .75; margin-bottom: 6px; }
    #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .7s; z-index: 30; }
    #msg { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); font-size: 22px; letter-spacing: 2px; text-shadow: 0 0 12px #9b8cff; pointer-events: none; opacity: 0; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="bar" id="hp"></div>
    <div id="energy"><div id="energyFill"></div></div>
    <div id="shards">✦ 0</div>
    <div id="quest"></div>
    <button id="menuBtn">II</button>
    <div id="msg"></div>
    <div id="stick"><div id="knob"></div></div>
    <div class="btn" id="bJump">SAUT</div>
    <div class="btn" id="bAtk">ATTAQUE</div>
    <div class="btn" id="bDash">DASH</div>
    <div class="btn" id="bSpec">SPÉC.</div>
  </div>
  <div id="title"></div>
  <div id="fade"></div>
  <div id="menu"></div>
  <div id="rotate"><div class="ico">📱</div><div>Tourne ton téléphone<br>en mode paysage pour jouer</div></div>
  <div id="err"></div>
  <script>
    // Affiche les erreurs à l'écran (utile pour déboguer sur téléphone)
    function showErr(m) { var e = document.getElementById('err'); e.style.display = 'block'; e.textContent += m + '\n'; }
    window.addEventListener('error', function (ev) { showErr('Erreur: ' + ev.message); });
    window.addEventListener('unhandledrejection', function (ev) { showErr('Erreur: ' + (ev.reason && ev.reason.message || ev.reason)); });
    // Appelé par le menu (dans un geste tactile) : plein écran + verrouillage paysage + démarrage du jeu
    window.enterGame = function () {
      var el = document.documentElement;
      var fs = el.requestFullscreen || el.webkitRequestFullscreen;
      var p = null; try { p = !document.fullscreenElement && fs ? fs.call(el) : null; } catch (e) {}
      var lock = function () { try { return screen.orientation.lock('landscape'); } catch (e) { return null; } };
      if (p && p.then) p.then(lock).catch(lock); else lock();
      document.body.dataset.started = '1';
    };
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
