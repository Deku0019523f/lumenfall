<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b0a14" />
  <title>Lumenfall</title>
  <!-- Permet de jouer directement depuis GitHub Pages (sans build) : "three" est chargé depuis un CDN -->
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
  <style>
    #menu { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; justify-content: center; overflow: hidden; box-sizing: border-box; font-family: 'Cormorant Garamond', 'Palatino Linotype', Palatino, Georgia, 'Times New Roman', serif; color: #e9e4d0; }
    #menu.pause { align-items: center; background: rgba(5,8,10,.86); }
    #menu.tree { background: radial-gradient(ellipse at 50% 30%, #1b2a2a, #070b0c 75%); }
    @font-face { font-family: 'EB Garamond'; font-weight: 400; src: url('./assets/fonts/eb-garamond-latin-400-normal.woff2') format('woff2'); font-display: swap; }
    @font-face { font-family: 'EB Garamond'; font-weight: 500; src: url('./assets/fonts/eb-garamond-latin-500-normal.woff2') format('woff2'); font-display: swap; }
    #menu { --u: calc(max(100vw, 179.14vh) / 2576); font-family: 'EB Garamond', 'Cormorant Garamond', 'Palatino Linotype', Palatino, Georgia, serif; }
    #menu.start { padding: 0 8vw; background: linear-gradient(90deg, rgba(4,8,12,.78), rgba(4,8,12,.4) 65%, rgba(4,8,12,.1)), #07100f url('./assets/ui/menu_bg.jpg') left top / cover no-repeat; }
    #menu.tree::after { content: ''; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 18vmin 6vmin rgba(0,0,0,.85); }
    #menu.start .beam { display: none; }
    #menu.start .panel { align-self: flex-start; margin-left: 4vw; min-width: min(420px, 80vw); background: rgba(5,9,12,.55); padding: 14px 26px 18px; border-radius: 14px; backdrop-filter: blur(3px); }
    /* menu d'accueil : mise en page calquée sur la maquette (unité --u = 1 px de l'image 2576 px de large) */
    #menu.home { --y: min(0px, calc(100vh - var(--u) * 1200)); padding: 0; background: #07100f; justify-content: flex-start; }
    #menu.home .stage { position: absolute; left: 0; top: var(--y); width: calc(var(--u) * 2576); height: calc(var(--u) * 1438); background: url('./assets/ui/menu_bg.jpg') 0 0 / 100% 100% no-repeat; }
    #menu.home .logo { position: absolute; left: calc(var(--u) * 70); top: calc(var(--u) * 70); width: calc(var(--u) * 1130); height: auto; pointer-events: none; filter: drop-shadow(0 4px 14px rgba(0,0,0,.55)); }
    #menu.home .list { position: absolute; left: calc(var(--u) * 358); top: calc(var(--u) * 526 + var(--y)); gap: 0; }
    #menu.home .mi { height: calc(var(--u) * 98); padding: 0; gap: 0; position: relative; opacity: .92; color: #f3efe0; font-weight: 400; font-size: calc(var(--u) * 66); letter-spacing: calc(var(--u) * 2.8); text-shadow: 0 2px 10px rgba(0,0,0,.6); }
    #menu.home .mi.first { height: calc(var(--u) * 144); align-items: flex-start; }
    #menu.home .mi.first > span { display: flex; flex-direction: column; }
    #menu.home .mi.first > span > b { display: block; font-weight: inherit; height: calc(var(--u) * 98); line-height: calc(var(--u) * 98); }
    #menu.home .mi i { position: absolute; left: calc(var(--u) * -103); top: calc(var(--u) * 16); width: calc(var(--u) * 65); height: calc(var(--u) * 65); background: url('./assets/ui/cursor.png') center / contain no-repeat; font-size: 0; filter: drop-shadow(0 0 calc(var(--u) * 12) rgba(255,220,120,.7)); }
    #menu.home .mi.first i { top: calc(var(--u) * 16); }
    #menu.home .mi span { border-bottom: 0; padding: 0; }
    #menu.home .mi small { display: block; margin-top: calc(var(--u) * -20); font-size: calc(var(--u) * 33); letter-spacing: calc(var(--u) * .6); opacity: .9; padding-bottom: calc(var(--u) * 6); border-bottom: calc(var(--u) * 3) solid transparent; width: calc(var(--u) * 487); box-sizing: border-box; white-space: nowrap; }
    #menu.home .mi:not(.first).sel > span { border-bottom: calc(var(--u) * 3) solid #f1dfa0; padding-bottom: calc(var(--u) * 2); }
    #menu.home .mi.sel small, #menu.home .mi:active small { border-bottom-color: #f1dfa0; }
    #menu.home .mi:disabled { opacity: .35; }
    #menu.home .mi.back { margin-top: 0; }
    #menu.home .ver { right: calc(var(--u) * 42); bottom: calc(var(--u) * 26); font-size: calc(var(--u) * 36); opacity: .55; color: #d8d2bc; }
    #menu .ver { position: absolute; right: 14px; bottom: 10px; font-size: 12px; opacity: .4; z-index: 1; }
    #menu .list { position: relative; z-index: 1; display: flex; flex-direction: column; gap: 2px; align-items: flex-start; }
    #menu.pause .list { align-items: stretch; min-width: min(360px, 80vw); }
    #menu .panel { position: relative; z-index: 1; max-width: 92vw; max-height: 94vh; overflow-y: auto; }
    #menu h2 { margin: 0 0 12px; font-size: clamp(24px, 6vh, 38px); font-style: italic; font-weight: 600; color: #f1dfa0; letter-spacing: 3px; }
    /* entrées de menu : texte seul, plume + soulignement sur la ligne choisie */
    #menu .mi { font: inherit; background: none; border: 0; color: #d8d6c4; opacity: .82; text-align: left; padding: 5px 4px; cursor: pointer; display: flex; align-items: center; gap: 12px;
      font-size: clamp(20px, 5.2vh, 30px); letter-spacing: 2px; -webkit-tap-highlight-color: transparent; }
    #menu .mi i { font-style: normal; width: 1.2em; color: #f1dfa0; visibility: hidden; text-shadow: 0 0 10px rgba(255,220,130,.8); }
    #menu .mi span { border-bottom: 2px solid transparent; padding-bottom: 1px; }
    #menu .mi small { display: block; font-size: .5em; letter-spacing: 1px; opacity: .7; }
    #menu .mi.sel, #menu .mi:active { opacity: 1; color: #fff7da; } #menu .mi.sel i, #menu .mi:active i { visibility: visible; }
    #menu .mi.sel span, #menu .mi:active span { border-bottom-color: #f1dfa0; }
    #menu .mi.danger { color: #e79a9a; } #menu .mi:disabled { opacity: .3; cursor: default; }
    #menu .help { max-width: 640px; font-size: clamp(14px, 3.6vh, 19px); line-height: 1.4; } #menu .help p { margin: 6px 0; } .dim2 { opacity: .6; }
    #menu .opt { display: flex; align-items: center; gap: 14px; margin: 10px 0; font-size: 22px; } #menu .opt span { width: 170px; } #menu .opt em { font-style: normal; width: 60px; color: #f1dfa0; }
    #menu .opt input { flex: 1; min-width: 140px; accent-color: #e6c76d; height: 28px; }
    #menu .gold, #shards { color: #ffe08a; }
    /* arbre de compétences */
    #menu .tabs { position: absolute; top: 10px; left: 0; right: 0; display: flex; justify-content: center; gap: 26px; z-index: 2; }
    #menu .tab { font: inherit; background: none; border: 0; color: #cfcab4; opacity: .55; font-size: clamp(16px, 4vh, 24px); letter-spacing: 3px; padding: 4px 8px; border-bottom: 2px solid transparent; }
    #menu .tab.on { opacity: 1; color: #fff3c8; border-bottom-color: #f1dfa0; }
    #menu .compass { position: absolute; top: 8px; left: 12px; z-index: 2; width: 62px; height: 62px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center;
      border: 2px solid #c9b676; box-shadow: 0 0 0 4px rgba(201,182,118,.25), inset 0 0 14px rgba(0,0,0,.6); background: radial-gradient(circle, #20332f, #0b1413); }
    #menu .compass b { font-size: 22px; color: #fff3c8; line-height: 1; } #menu .compass small { color: #f1dfa0; font-size: 12px; }
    #menu .graph { position: absolute; left: 0; right: 0; top: 52px; bottom: 62px; width: 100%; height: calc(100% - 114px); }
    #menu .ln { stroke: rgba(230,222,190,.35); stroke-width: 2; } #menu .ln.hid { stroke: rgba(230,222,190,.12); }
    #menu .ln.own { stroke: #fff; stroke-width: 2.5; stroke-dasharray: 9 7; animation: dash 1.2s linear infinite; } @keyframes dash { to { stroke-dashoffset: -16; } }
    #menu .nd { cursor: pointer; }
    #menu .nd .disc { fill: #0f1a1a; stroke: var(--c); stroke-width: 3; }
    #menu .nd .ring { fill: none; stroke: var(--c); stroke-width: 1.5; stroke-dasharray: 3 6; opacity: .55; }
    #menu .nd .ring2 { fill: none; stroke: var(--c); stroke-width: 1; opacity: .35; }
    #menu .nd .ico { fill: #efe7c8; font-size: 26px; text-anchor: middle; font-family: 'Segoe UI Symbol', 'Noto Sans Symbols', sans-serif; }
    #menu .nd .lbl { fill: #d8d4bd; font-size: 17px; text-anchor: middle; font-style: italic; paint-order: stroke; stroke: #070b0c; stroke-width: 4px; }
    #menu .nd.owned .disc { fill: color-mix(in srgb, var(--c) 35%, #0f1a1a); } #menu .nd.owned .ring { opacity: .9; }
    #menu .nd.ok .disc { fill: color-mix(in srgb, var(--c) 18%, #0f1a1a); animation: pulse 1.6s ease-in-out infinite; }
    #menu .nd.poor .ico, #menu .nd.locked .ico { opacity: .55; } #menu .nd.locked .disc, #menu .nd.poor .disc { stroke-opacity: .55; }
    #menu .nd.hidden .disc { stroke: #6e6b5a; } #menu .nd.hidden .ring, #menu .nd.hidden .ring2 { stroke: #6e6b5a; }
    #menu .nd.sel .ring2 { stroke-width: 3; opacity: 1; } #menu .nd.sel .ring { opacity: 1; animation: spin 14s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes pulse { 50% { filter: drop-shadow(0 0 8px var(--c)); } } @keyframes spin { to { transform: rotate(360deg); } }
    #menu .info { position: absolute; left: 14px; bottom: 10px; max-width: 46vw; display: flex; flex-direction: column; gap: 1px; z-index: 2; font-size: clamp(13px, 3.4vh, 18px); }
    #menu .info b { color: #fff3c8; font-size: 1.25em; font-style: italic; } #menu .info span { opacity: .85; } #menu .info em { font-style: normal; color: #f1dfa0; } #menu .info em.g { color: #9be36a; }
    #menu .hints { position: absolute; right: 14px; bottom: 10px; display: flex; gap: 18px; z-index: 2; }
    #menu .hint { font: inherit; background: none; border: 0; color: #d8d6c4; font-size: clamp(16px, 4vh, 22px); letter-spacing: 2px; padding: 6px 4px; border-bottom: 2px solid rgba(241,223,160,.4); }
    #menu .hint.ok { color: #fff3c8; border-bottom-color: #f1dfa0; text-shadow: 0 0 10px rgba(255,220,130,.6); } #menu .hint:disabled { opacity: .3; border-bottom-color: transparent; }
    #menu .qlist { position: absolute; top: 56px; bottom: 60px; left: 50%; transform: translateX(-50%); width: min(640px, 92vw); overflow-y: auto; text-align: left; z-index: 1; }
    #menu .qch { margin: 10px 0 4px; letter-spacing: 3px; font-size: 14px; opacity: .7; }
    #menu .q { display: flex; justify-content: space-between; gap: 10px; padding: 7px 10px; background: rgba(255,240,190,.07); border-left: 2px solid #c9b676; margin-bottom: 4px; font-size: 17px; }
    #menu .q.done { opacity: .55; } #menu .q em { font-style: normal; color: #ffe08a; white-space: nowrap; }
    #shards { position: absolute; top: calc(54px + env(safe-area-inset-top)); left: 14px; font-size: 15px; font-weight: 700; text-shadow: 0 0 8px #b8860b; pointer-events: none; transition: transform .1s; transform-origin: left; }
    #shards.pulse { transform: scale(1.25); }
    #quest { position: absolute; top: calc(66px + env(safe-area-inset-top)); right: 14px; max-width: 34vw; text-align: right; font-size: 12px; opacity: .85; text-shadow: 0 0 6px #000; pointer-events: none; display: none; }
    #dialog { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom)); width: min(720px, 92vw); z-index: 40; background: rgba(10,8,28,.92); border: 2px solid #9b8cff; border-radius: 14px; padding: 12px 16px 14px; display: none; box-shadow: 0 0 22px rgba(155,140,255,.4); }
    #dialog .who { color: #ffe08a; font-weight: 800; letter-spacing: 2px; margin-bottom: 4px; font-size: 14px; }
    #dialog .txt { font-size: 16px; line-height: 1.4; min-height: 46px; }
    #dialog .nxt { text-align: right; opacity: .6; font-size: 12px; animation: blink 1s infinite; } @keyframes blink { 50% { opacity: .1; } }
    #rotate { position: fixed; inset: 0; z-index: 60; background: #0b0a14; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; font-size: 20px; padding: 24px; }
    #rotate .ico { font-size: 64px; animation: tilt 1.6s ease-in-out infinite; }
    @keyframes tilt { 0%, 100% { transform: rotate(0); } 50% { transform: rotate(-90deg); } }
    @media (orientation: portrait) { #rotate { display: flex; } }
    #err { position: fixed; left: 8px; right: 8px; bottom: 8px; z-index: 70; background: rgba(120,0,30,.9); color: #fff; font: 12px monospace; padding: 8px; border-radius: 6px; display: none; white-space: pre-wrap; }
    html, body { margin: 0; height: 100%; background: #0b0a14; overflow: hidden;
      touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
      font-family: system-ui, sans-serif; color: #e8e4ff; }
    #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #hud { position: fixed; inset: 0; pointer-events: none; }
    #hud > * { pointer-events: auto; }
    .bar { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 14px; display: flex; gap: 6px; align-items: center; pointer-events: none; }
    .mask { width: 18px; height: 22px; border-radius: 50% 50% 45% 45%; background: #e8e4ff; box-shadow: 0 0 8px #9b8cff; }
    .mask.empty { background: transparent; border: 2px solid #5b5580; box-shadow: none; }
    #energy { position: absolute; top: calc(40px + env(safe-area-inset-top)); left: 14px; width: 120px; height: 8px; background: #1d1a33; border-radius: 4px; overflow: hidden; pointer-events: none; }
    #energyFill { height: 100%; width: 100%; background: linear-gradient(90deg, #6ee7ff, #9b8cff); transition: width .1s; }
    #menuBtn { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 14px; width: 44px; height: 44px; border-radius: 50%; border: 2px solid #5b5580; background: rgba(20,18,40,.6); color: #e8e4ff; font-size: 18px; }
    #stick { position: absolute; left: 24px; bottom: calc(24px + env(safe-area-inset-bottom)); width: 140px; height: 140px; border-radius: 50%; background: rgba(155,140,255,.12); border: 2px solid rgba(155,140,255,.35); }
    #knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(155,140,255,.55); }
    .btn { position: absolute; width: 68px; height: 68px; border-radius: 50%; border: 2px solid rgba(232,228,255,.5); background: rgba(20,18,40,.55); color: #e8e4ff; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
    .btn.on { background: rgba(155,140,255,.5); }
    #bAtk { right: 28px; bottom: calc(60px + env(safe-area-inset-bottom)); width: 84px; height: 84px; }
    #bJump { right: 124px; bottom: calc(36px + env(safe-area-inset-bottom)); }
    #bDash { right: 28px; bottom: calc(160px + env(safe-area-inset-bottom)); }
    #bSpec { right: 112px; bottom: calc(118px + env(safe-area-inset-bottom)); width: 60px; height: 60px; }
    #title { position: fixed; left: 0; right: 0; top: 32%; text-align: center; font-size: 38px; letter-spacing: 5px; text-shadow: 0 0 18px #9b8cff; pointer-events: none; opacity: 0; z-index: 20; }
    #title small { display: block; font-size: 15px; letter-spacing: 6px; opacity: .75; margin-bottom: 6px; }
    #fade { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .7s; z-index: 30; }
    #msg { position: absolute; left: 50%; top: 22%; transform: translateX(-50%); font-size: 22px; letter-spacing: 2px; text-shadow: 0 0 12px #9b8cff; pointer-events: none; opacity: 0; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="hud">
    <div class="bar" id="hp"></div>
    <div id="energy"><div id="energyFill"></div></div>
    <div id="shards">✦ 0</div>
    <div id="quest"></div>
    <button id="menuBtn">II</button>
    <div id="msg"></div>
    <div id="stick"><div id="knob"></div></div>
    <div class="btn" id="bJump">SAUT</div>
    <div class="btn" id="bAtk">ATTAQUE</div>
    <div class="btn" id="bDash">DASH</div>
    <div class="btn" id="bSpec">SPÉC.</div>
  </div>
  <div id="title"></div>
  <div id="fade"></div>
  <div id="menu"></div>
  <div id="rotate"><div class="ico">📱</div><div>Tourne ton téléphone<br>en mode paysage pour jouer</div></div>
  <div id="err"></div>
  <script>
    // Affiche les erreurs à l'écran (utile pour déboguer sur téléphone)
    function showErr(m) { var e = document.getElementById('err'); e.style.display = 'block'; e.textContent += m + '\n'; }
    window.addEventListener('error', function (ev) { showErr('Erreur: ' + ev.message); });
    window.addEventListener('unhandledrejection', function (ev) { showErr('Erreur: ' + (ev.reason && ev.reason.message || ev.reason)); });
    // Appelé par le menu (dans un geste tactile) : plein écran + verrouillage paysage + démarrage du jeu
    window.enterGame = function () {
      var el = document.documentElement;
      var fs = el.requestFullscreen || el.webkitRequestFullscreen;
      var p = null; try { p = !document.fullscreenElement && fs ? fs.call(el) : null; } catch (e) {}
      var lock = function () { try { return screen.orientation.lock('landscape'); } catch (e) { return null; } };
      if (p && p.then) p.then(lock).catch(lock); else lock();
      document.body.dataset.started = '1';
    };
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
